<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; img-src 'self' https://i.scdn.co;"
  >

  <title>Pixel Player</title>

  <link rel="stylesheet" href="styles.css">
  <script src="renderer.js" defer></script>
</head>

<body>
  <main class="player">
    <header class="player-header">
      <h1>PIXEL PLAYER</h1>
      <span class="mode-label">DEMO</span>
    </header>

    <section
      class="room"
      aria-label="Pixel-art nighttime room with a moonlit window"
    >
      <div class="stars" aria-hidden="true">✦ · ✧</div>

      <div class="night-window" aria-hidden="true">
        <div class="moon"></div>
        <div class="window-cross"></div>
      </div>

      <div class="room-caption" aria-hidden="true">
        late night listening…
      </div>

      <div class="desk" aria-hidden="true"></div>
    </section>

    <section class="music-info" aria-labelledby="song-title">
      <div class="album-placeholder" aria-hidden="true">♫</div>

      <img
        id="album-art"
        class="album-art"
        alt=""
        hidden
      >

      <div class="track-info">
        <p class="eyebrow">YOUR LITTLE MUSIC ROOM</p>
        <h2 id="song-title">Waiting for a song</h2>
        <p class="artist">Connect Spotify to begin</p>
      </div>
    </section>

    <section class="playback" aria-label="Playback controls">
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill"></div>
      </div>

      <div class="timestamps" aria-hidden="true">
        <span>0:00</span>
        <span>0:00</span>
      </div>

      <div class="controls">
        <button
          class="control-button"
          type="button"
          aria-label="Previous track"
          disabled
        >⏮</button>

        <button
          class="control-button play-button"
          type="button"
          aria-label="Play"
          disabled
        >▶</button>

        <button
          class="control-button"
          type="button"
          aria-label="Next track"
          disabled
        >⏭</button>
      </div>
    </section>

    <div class="connect-area">
      <button id="connect-button" type="button">
        Connect Spotify
      </button>

      <button id="refresh-button" type="button" disabled>
        Refresh track
      </button>

      <p id="connection-message" role="status">
        Spotify not connected
      </p>
    </div>
  </main>
</body>
</html>
